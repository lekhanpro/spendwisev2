name: spendwise
description: "SpendWise - AI-Powered Finance Tracker"
publish_to: 'none'
version: 2.2.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_database: ^11.3.5
  provider: ^6.1.2
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  http: ^1.4.0
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/images/adaptive-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
